<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICT</title>
    <style>

        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        form {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: #fff;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #customers {
            counter-reset: rowNumber;
        }

        #customers tbody tr {
            counter-increment: rowNumber;
        }

        #customers tbody tr td:first-of-type::before {
            content: counter(rowNumber);
        }
        .form-group select{
            padding: 10px;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form name="Device" method="post" action="{% url 'Device' %}">
            {% csrf_token %}
            <h1>Device</h1>
            <div class="form-group">
            <label for="Device_type">Device Type:</label>
                <select name="Device_type" id="Device_type">
                    {% for i in data1 %}
                        <option value="{{ i.0 }}">{{ i.0 }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="device_quantity">Device Quantity:</label>
                <input type="number" id="device_quantity" name="device_quantity" required>
            </div>
            <div class="form-group">
                <button type="submit">Search Device</button>
            </div>
        </form>
        <h1>Device List</h1>
        <table id="customers">
            <thead>
                <tr>
                    <th>S No.</th>
                    <th>Device ID</th>
                    <th>Device Name</th>
                    <th>Device Number</th>
                </tr>
            </thead>
            <tbody>
                {% for i in data %}
                    <tr>
                        <td></td>
                        <td>{{ i.0 }}</td>
                        <td>{{ i.2 }}</td>
                        <td>{{ i.1 }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
