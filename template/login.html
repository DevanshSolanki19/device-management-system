<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NICT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .content {
            max-width: 600px;
            margin: 0;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-left: 400px;
        }

        .content img {
            max-width: 100%;
            margin-bottom: 20px;
        }

        .content h1 {
            text-align: center;
            color: #333;
        }

        form {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #007bff;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 5px;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        .form-group select{
            padding: 10px;
            width: 100%;
        }

    </style>
</head>
<body>
<div class="content">
    <img src="https://nict.ind.in/BOB_Ledger/images/nict_logo.png" width="300">
    <h1>Device Management System (DMS)</h1>
    <form name="Login" method="POST" action="{% url 'select' %}">
        {% csrf_token %}
        <h2>Login form</h2>
        {% if error %}<p style="color: red; margin: 10px 0;">{{ error }}</p>{% endif %}
        <div class="form-group">
        <label for="Role">Role:</label>
            <select name="Role" id="Role">
            <option value="Admin">Admin</option>
            <option value="Stock Manager(H.O.)">Stock Manager(H.O.)</option>
            <option value="Executive(H.O.)">Executive(H.O.)</option>
            <option value="SPM (State Office)">SPM (State Office)</option>
            <option value="Executive(State Office)">Executive(State Office)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <button type="submit">Login</button>
      </div>
        <li><a href="{% url 'signup' %}">Signup</a></li>
    </form>
</div>
</body>
</html>
<script>
     function logout() {
        window.close()
    }
</script>
